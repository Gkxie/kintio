name: Release Codex validation

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - CHANGELOG.md
      - package.json
      - src/version.ts

permissions:
  contents: read

concurrency:
  group: release-codex-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Authorize deterministic Release
    if: >-
      github.repository == 'Gkxie/kintio' &&
      github.event_name == 'pull_request_target' &&
      github.run_attempt == 1 &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/next' &&
      github.event.pull_request.user.login == 'kintio-release[bot]' &&
      ((github.actor == 'kintio-release[bot]' &&
        github.triggering_actor == 'kintio-release[bot]') ||
       (github.actor == 'Gkxie' &&
        github.triggering_actor == 'Gkxie'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      authorized: ${{ steps.release.outputs.authorized }}
      head_sha: ${{ steps.release.outputs.head_sha }}
    steps:
      - name: Check out the trusted Release validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the exact Release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Verify and bind the deterministic Release candidate
        id: release
        working-directory: candidate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_BOT_LOGIN: kintio-release[bot]
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          node --experimental-strip-types \
            ../trusted/.github/scripts/reconcile-release.ts verify
          printf 'authorized=true\nhead_sha=%s\n' "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  validate:
    name: Approved Release Codex smoke test
    needs: authorize
    if: needs.authorize.outputs.authorized == 'true'
    environment: codex-eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          persist-credentials: false
      - name: Confirm the approved immutable source
        env:
          AUTHORIZED_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$AUTHORIZED_HEAD_SHA"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install locked project dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download and verify the pinned Codex CLI
        env:
          CODEX_ARCHIVE: codex-package-x86_64-unknown-linux-musl.tar.gz
          CODEX_SHA256: 6e35ac60b86c0e8c7f8bcf797be8b92206199f6253200b66ff0547276f8cfa5c
        run: |
          archive="$RUNNER_TEMP/$CODEX_ARCHIVE"
          install -d -m 700 "$RUNNER_TEMP/kintio-codex"
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 \
            --output "$archive" \
            "https://github.com/openai/codex/releases/download/rust-v0.151.0/$CODEX_ARCHIVE"
          printf '%s  %s\n' "$CODEX_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/kintio-codex"
          test -x "$RUNNER_TEMP/kintio-codex/bin/codex"
          test "$("$RUNNER_TEMP/kintio-codex/bin/codex" --version)" = "codex-cli 0.151.0"
          echo "$RUNNER_TEMP/kintio-codex/bin" >> "$GITHUB_PATH"
      - name: Prepare isolated Codex state
        env:
          KINTIO_CI_BASE_URL: ${{ vars.KINTIO_CI_BASE_URL }}
        run: |
          test "$KINTIO_CI_BASE_URL" = "https://www.xieyu.chat"
          install -d -m 700 "$RUNNER_TEMP/kintio-codex-home"
          cat > "$RUNNER_TEMP/kintio-codex-home/config.toml" <<EOF
          model_provider = "OpenAI"
          model = "gpt-5.6-luna"
          review_model = "gpt-5.6-luna"
          model_reasoning_effort = "none"
          disable_response_storage = true
          network_access = "enabled"
          windows_wsl_setup_acknowledged = true

          [model_providers.OpenAI]
          name = "OpenAI"
          base_url = "$KINTIO_CI_BASE_URL"
          wire_api = "responses"
          requires_openai_auth = true

          [features]
          goals = true
          EOF
          chmod 600 "$RUNNER_TEMP/kintio-codex-home/config.toml"
      - name: Authenticate isolated Codex host
        env:
          CODEX_HOME: ${{ runner.temp }}/kintio-codex-home
          KINTIO_CI_API_KEY: ${{ secrets.KINTIO_CI_API_KEY }}
        run: printf '%s' "$KINTIO_CI_API_KEY" | codex login --with-api-key
      - name: Run the fixed real Codex smoke test
        env:
          CODEX_HOME: ${{ runner.temp }}/kintio-codex-home
          RUN_REAL_CODEX: 1
        run: >-
          pnpm exec vitest run
          --project agent-eval
          --coverage.enabled=false
          -t '^real Codex executes one text reply through MCP and fake WeChat accepts it$'
      - name: Remove isolated Codex state
        if: always()
        run: >-
          node --input-type=module -e
          "import { rmSync } from 'node:fs';
          for (const path of ['kintio-codex-home', 'kintio-codex',
          'codex-package-x86_64-unknown-linux-musl.tar.gz'])
          rmSync(process.env.RUNNER_TEMP + '/' + path,
          { recursive: true, force: true });"
