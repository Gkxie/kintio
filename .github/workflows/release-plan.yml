name: Release candidate

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Release plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the trusted validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate the generated candidate or accept an ordinary PR
        working-directory: candidate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          RELEASE_BOT_LOGIN: kintio-release[bot]
        run: |
          validator=../trusted/.github/scripts/reconcile-release.ts
          test -f "$validator" || validator=.github/scripts/reconcile-release.ts
          node --experimental-strip-types "$validator" verify
