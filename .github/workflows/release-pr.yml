name: Release PR

on:
  pull_request:
    branches: [master]
    types: [closed]

permissions: {}

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  tag-and-dispatch:
    name: Tag and dispatch release
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.merged_by.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate the merged Release PR, create its tag, and dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          node --input-type=module <<'NODE'
          const repository = process.env.REPOSITORY;
          const mergeSha = process.env.MERGE_SHA;
          const pullNumber = Number(process.env.PR_NUMBER);
          const token = process.env.GH_TOKEN;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: 'Bearer ' + token,
            'Content-Type': 'application/json',
            'User-Agent': 'kintio-release-pr',
            'X-GitHub-Api-Version': '2022-11-28',
          };
          const api = async (route, options = {}) => {
            const response = await fetch(
              'https://api.github.com/repos/' + repository + route,
              {
                method: options.method || 'GET',
                headers,
                body: options.body ? JSON.stringify(options.body) : undefined,
              },
            );
            if (options.allow404 && response.status === 404) return undefined;
            if (!response.ok) {
              throw new Error(
                (options.method || 'GET') + ' ' + route + ' failed: HTTP '
                  + response.status + ' ' + await response.text(),
              );
            }
            return response.status === 204 ? undefined : response.json();
          };
          const readFile = async (file) => {
            const result = await api(
              '/contents/' + file + '?ref=' + encodeURIComponent(mergeSha),
            );
            if (result.type !== 'file' || typeof result.content !== 'string') {
              throw new Error('cannot read ' + file + ' from the merge commit');
            }
            return Buffer.from(result.content.replace(/\s/gu, ''), 'base64')
              .toString('utf8');
          };

          const branch = /^release\/v(\d+\.\d+\.\d+)$/u.exec(
            process.env.HEAD_REF || '',
          );
          if (!branch) throw new Error('release branch must be release/vX.Y.Z');
          const version = branch[1];
          const tag = 'v' + version;
          if (process.env.PR_TITLE !== 'chore(release): prepare ' + tag) {
            throw new Error('Release PR title does not match ' + tag);
          }

          const pull = await api('/pulls/' + pullNumber);
          if (
            !pull.merged
            || pull.base?.ref !== 'master'
            || pull.merged_by?.login !== process.env.REPOSITORY_OWNER
            || pull.merge_commit_sha !== mergeSha
            || pull.head?.ref !== process.env.HEAD_REF
            || pull.head?.repo?.full_name !== repository
          ) {
            throw new Error('pull request identity differs from the merged event');
          }

          const files = [];
          for (let page = 1; page <= 100; page += 1) {
            const items = await api(
              '/pulls/' + pullNumber + '/files?per_page=100&page=' + page,
            );
            files.push(...items);
            if (items.length < 100) break;
          }
          const required = ['CHANGELOG.md', 'package.json', 'src/version.ts'];
          const allowed = new Set([...required, 'SECURITY.md']);
          for (const file of required) {
            if (!files.some((item) => item.filename === file)) {
              throw new Error('Release PR must change ' + file);
            }
          }
          for (const file of files) {
            if (file.status === 'renamed') {
              throw new Error('Release PR cannot rename files');
            }
            if (!allowed.has(file.filename)) {
              throw new Error('Release PR changed ' + file.filename);
            }
          }

          const [packageSource, runtimeSource, changelog] = await Promise.all([
            readFile('package.json'),
            readFile('src/version.ts'),
            readFile('CHANGELOG.md'),
          ]);
          const packageJson = JSON.parse(packageSource);
          if (packageJson.name !== '@kin-tio/cli' || packageJson.version !== version) {
            throw new Error('package identity does not match the Release PR');
          }
          const runtimeVersion = /^export const KINTIO_VERSION = ['"]([^'"]+)['"];\r?\n?$/u
            .exec(runtimeSource)?.[1];
          if (runtimeVersion !== version) {
            throw new Error('runtime version does not match the Release PR');
          }
          const lines = changelog.split(/\r?\n/u);
          const unreleased = lines.reduce(
            (matches, line, index) => line === '## Unreleased'
              ? [...matches, index]
              : matches,
            [],
          );
          const prefix = '## ' + version + ' - ';
          const releaseSections = lines.reduce(
            (matches, line, index) =>
              line.startsWith(prefix) && /^\d{4}-\d{2}-\d{2}$/u.test(
                line.slice(prefix.length),
              )
                ? [...matches, index]
                : matches,
            [],
          );
          if (
            unreleased.length !== 1
            || releaseSections.length !== 1
            || unreleased[0] > releaseSections[0]
            || lines.slice(unreleased[0] + 1, releaseSections[0]).join('\n').trim()
          ) {
            throw new Error('Changelog does not freeze one empty Unreleased section');
          }
          const nextSection = lines.findIndex(
            (line, index) => index > releaseSections[0] && line.startsWith('## '),
          );
          const notes = lines.slice(
            releaseSections[0] + 1,
            nextSection < 0 ? lines.length : nextSection,
          );
          if (!notes.some((line) => line.startsWith('- '))) {
            throw new Error('release Changelog section has no entries');
          }

          const parseVersion = (value) => {
            const match = /^v?(\d+)\.(\d+)\.(\d+)$/u.exec(value);
            return match ? match.slice(1).map(Number) : undefined;
          };
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) return left[index] - right[index];
            }
            return 0;
          };
          const refs = await api('/git/matching-refs/tags/v');
          const versions = refs
            .map((item) => String(item.ref || '').replace(/^refs\/tags\//u, ''))
            .filter((item) => /^v\d+\.\d+\.\d+$/u.test(item))
            .filter((item) => item !== tag);
          versions.sort((left, right) => compare(parseVersion(right), parseVersion(left)));
          if (versions[0] && compare(parseVersion(version), parseVersion(versions[0])) <= 0) {
            throw new Error(version + ' must be newer than ' + versions[0]);
          }

          let tagRef = await api(
            '/git/ref/tags/' + encodeURIComponent(tag),
            { allow404: true },
          );
          if (tagRef) {
            if (tagRef.object?.type !== 'tag') {
              throw new Error(tag + ' exists but is not annotated');
            }
            const tagObject = await api('/git/tags/' + tagRef.object.sha);
            if (tagObject.object?.type !== 'commit' || tagObject.object.sha !== mergeSha) {
              throw new Error(tag + ' points to a different commit');
            }
          } else {
            const tagObject = await api('/git/tags', {
              method: 'POST',
              body: {
                tag,
                message: tag,
                object: mergeSha,
                type: 'commit',
              },
            });
            tagRef = await api('/git/refs', {
              method: 'POST',
              body: {
                ref: 'refs/tags/' + tag,
                sha: tagObject.sha,
              },
            });
          }

          const runs = await api(
            '/actions/workflows/release.yml/runs?branch='
              + encodeURIComponent(tag) + '&per_page=20',
          );
          const alreadyDispatched = runs.workflow_runs?.some(
            (run) => run.head_sha === mergeSha && run.conclusion !== 'cancelled',
          );
          if (!alreadyDispatched) {
            await api('/actions/workflows/release.yml/dispatches', {
              method: 'POST',
              body: { ref: tag },
            });
            console.log('Created ' + tag + ' and dispatched release.yml');
          } else {
            console.log(tag + ' already has a release workflow run');
          }
          NODE
