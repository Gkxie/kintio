name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -p tsconfig.test.json
      - run: KNIP_DISABLE_RAW_TRANSFER=1 pnpm exec knip
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: pnpm run build
      - name: Install the exact npm tarball
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          node --experimental-strip-types scripts/prepare-package.ts
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package" > "$RUNNER_TEMP/npm-pack.json"
          package_file=$(node --input-type=module -e "import fs from 'node:fs'; const [packed]=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); if (!packed?.filename) throw new Error('npm pack returned no file'); process.stdout.write(packed.filename)" "$RUNNER_TEMP/npm-pack.json")
          package_version=$(node --input-type=module -e "import fs from 'node:fs'; process.stdout.write(JSON.parse(fs.readFileSync('package.json','utf8')).version)")
          npm install --global --prefix "$RUNNER_TEMP/kintio-global" "$RUNNER_TEMP/npm-package/$package_file" --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org/
          test "$("$RUNNER_TEMP/kintio-global/bin/kintio" --version)" = "$package_version"
          package_root="$RUNNER_TEMP/kintio-global/lib/node_modules/@kin-tio/cli"
          PACKAGE_ROOT="$package_root" PACKAGE_VERSION="$package_version" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const changelog = fs.readFileSync(
            path.join(process.env.PACKAGE_ROOT, 'CHANGELOG.md'),
            'utf8',
          );
          if (!changelog.startsWith(`# Changelog\n\n## ${process.env.PACKAGE_VERSION}\n`)) {
            throw new Error('packed Changelog does not start with the package version');
          }
          if (
            changelog.includes('## Unreleased')
            || changelog.includes('This file records important user-visible changes')
          ) {
            throw new Error('packed Changelog contains repository-only headings');
          }
          for (const file of [
            '.env.example',
            'README.zh-CN.md',
            'assets/avatar.svg',
            'assets/logo.svg',
          ]) {
            if (fs.existsSync(path.join(process.env.PACKAGE_ROOT, file))) {
              throw new Error(`npm package contains repository-only file: ${file}`);
            }
          }
          NODE
          HOME="$RUNNER_TEMP/kintio-profile" "$RUNNER_TEMP/kintio-global/bin/kintio" setup
          test -f "$RUNNER_TEMP/kintio-profile/.kintio/.env"
          test -f "$RUNNER_TEMP/kintio-profile/.kintio/codex-workspace/.agents/skills/wechat-kf-reply-sop/SKILL.md"

  platform-tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Unit, integration, recovery, security
    if: always()
    needs: platform-tests
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported operating system to pass
        env:
          PLATFORM_RESULT: ${{ needs.platform-tests.result }}
        run: test "$PLATFORM_RESULT" = success
