name: Release

on:
  push:
    tags: ['v*.*.*']

permissions: {}

concurrency:
  group: release
  queue: max
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate immutable source, version, and release notes
        id: metadata
        env:
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git tag --list 'v*' > "$RUNNER_TEMP/version-tags.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const tag = process.env.RELEASE_TAG || '';
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = String(packageJson.version || '');
          if (!/^\d+\.\d+\.\d+$/u.test(version) || tag !== `v${version}`) {
            throw new Error(`tag ${tag} does not match package version ${version}`);
          }
          const runtimeVersion = fs.readFileSync('src/version.ts', 'utf8');
          const runtimeVersionMatch = /^export const KINTIO_VERSION = ['"]([^'"]+)['"];\r?\n?$/u.exec(
            runtimeVersion,
          );
          if (runtimeVersionMatch?.[1] !== version) {
            throw new Error(`runtime version does not match ${version}`);
          }

          const [owner, repository] = (process.env.GITHUB_REPOSITORY || '').split('/');
          const releases = [];
          for (let page = 1; page <= 100; page += 1) {
            const response = await fetch(
              `https://api.github.com/repos/${owner}/${repository}/releases?per_page=100&page=${page}`,
              { headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'User-Agent': 'kintio-release',
                'X-GitHub-Api-Version': '2022-11-28',
              } },
            );
            if (!response.ok) throw new Error(`cannot list published releases: HTTP ${response.status}`);
            const pageItems = await response.json();
            if (!Array.isArray(pageItems)) throw new Error('invalid GitHub releases response');
            releases.push(...pageItems);
            if (pageItems.length < 100) break;
          }
          const currentRelease = releases.find((release) => release.tag_name === tag);
          if (currentRelease) {
            throw new Error(`pre-existing release for ${tag} is refused`);
          }

          const parseVersion = (value) => {
            const match = /^v?(\d+)\.(\d+)\.(\d+)$/u.exec(value);
            return match ? match.slice(1).map(Number) : undefined;
          };
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) return left[index] - right[index];
            }
            return 0;
          };
          const immutableTags = fs.readFileSync(
            `${process.env.RUNNER_TEMP}/version-tags.txt`,
            'utf8',
          ).split(/\r?\n/u)
            .filter((versionTag) => /^v\d+\.\d+\.\d+$/u.test(versionTag))
            .filter((versionTag) => versionTag !== tag);
          immutableTags.sort((left, right) =>
            compare(parseVersion(right), parseVersion(left))
          );
          const latestTag = immutableTags[0]?.replace(/^v/u, '');
          if (latestTag && compare(parseVersion(version), parseVersion(latestTag)) <= 0) {
            throw new Error(`${version} must be newer than immutable tag ${latestTag}`);
          }
          const stable = releases
            .filter((release) => !release.draft && !release.prerelease)
            .map((release) => String(release.tag_name || ''))
            .filter((releaseTag) => /^v\d+\.\d+\.\d+$/u.test(releaseTag));
          stable.sort((left, right) => compare(parseVersion(right), parseVersion(left)));
          const latestPublished = stable[0]?.replace(/^v/u, '');
          if (latestPublished && compare(parseVersion(version), parseVersion(latestPublished)) < 0) {
            throw new Error(`${version} must be newer than published ${latestPublished}`);
          }

          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/u);
          const unreleased = lines.reduce(
            (indexes, line, index) => line === '## Unreleased' ? [...indexes, index] : indexes,
            [],
          );
          if (unreleased.length !== 1) throw new Error('CHANGELOG.md requires one Unreleased section');
          const findVersion = (target) => {
            const prefix = `## ${target} - `;
            const matches = lines.reduce(
              (indexes, line, index) =>
                line.startsWith(prefix) && /^\d{4}-\d{2}-\d{2}$/u.test(line.slice(prefix.length))
                  ? [...indexes, index]
                  : indexes,
              [],
            );
            if (matches.length !== 1) {
              throw new Error(`CHANGELOG.md requires one dated section for ${target}`);
            }
            return matches[0];
          };
          const start = findVersion(version);
          if (unreleased[0] > start) throw new Error('Unreleased must precede released versions');
          const nextSection = lines.findIndex(
            (line, index) => index > start && line.startsWith('## '),
          );
          const end = latestPublished && latestPublished !== version
            ? findVersion(latestPublished)
            : (nextSection < 0 ? lines.length : nextSection);
          if (end <= start) throw new Error('published changelog versions are not descending');
          const notes = lines.slice(start + 1, end).join('\n').trim();
          if (!notes.split('\n').some((line) => line.startsWith('- '))) {
            throw new Error(`CHANGELOG.md has no unpublished entries for ${version}`);
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/release-notes.md`, `${notes}\n`);
          NODE

          commit=$(git rev-parse HEAD)
          event_commit=$(git rev-parse "${EVENT_SHA}^{commit}")
          test "$commit" = "$event_commit" || {
            echo 'Checked out commit differs from the tag push event; release refused.'
            exit 1
          }
          git merge-base --is-ancestor "$commit" refs/remotes/origin/master || {
            echo 'Tagged commit is not reachable from origin/master; release refused.'
            exit 1
          }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - run: pnpm exec tsc -p tsconfig.test.json
      - run: KNIP_DISABLE_RAW_TRANSFER=1 pnpm exec knip
      - run: pnpm test
      - run: pnpm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes-${{ github.run_id }}
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes-${{ github.run_id }}
          path: release-input
      - name: Verify remote tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type')
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$tag_type" = 'tag' || {
            echo 'Release tags must be annotated tags.'
            exit 1
          }
          target_type=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.object.type')
          target_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.object.sha')
          test "$target_type" = 'commit' && test "$target_commit" = "$VERIFIED_COMMIT" || {
            echo 'Remote tag no longer points to the verified commit; release refused.'
            exit 1
          }

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file release-input/release-notes.md
