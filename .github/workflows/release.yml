name: Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  queue: max
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      package_name: ${{ steps.package.outputs.name }}
      package_version: ${{ steps.package.outputs.version }}
      package_file: ${{ steps.package.outputs.filename }}
      package_integrity: ${{ steps.package.outputs.integrity }}
      pull_request: ${{ steps.metadata.outputs.pull_request }}
      release_version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate immutable source, version, and release notes
        id: metadata
        env:
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BOT_LOGIN: kintio-release[bot]
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          git tag --list 'v*' > "$RUNNER_TEMP/version-tags.txt"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const tag = process.env.RELEASE_TAG || '';
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const version = String(packageJson.version || '');
          if (!/^\d+\.\d+\.\d+$/u.test(version) || tag !== `v${version}`) {
            throw new Error(`tag ${tag} does not match package version ${version}`);
          }
          const runtimeVersion = fs.readFileSync('src/version.ts', 'utf8');
          const runtimeVersionMatch = /^export const KINTIO_VERSION = ['"]([^'"]+)['"];\r?\n?$/u.exec(
            runtimeVersion,
          );
          if (runtimeVersionMatch?.[1] !== version) {
            throw new Error(`runtime version does not match ${version}`);
          }

          const [owner, repository] = (process.env.GITHUB_REPOSITORY || '').split('/');
          const github = async (route) => {
            const response = await fetch(
              'https://api.github.com/repos/' + owner + '/' + repository + route,
              { headers: {
                Accept: 'application/vnd.github+json',
                Authorization: 'Bearer ' + process.env.GH_TOKEN,
                'User-Agent': 'kintio-release',
                'X-GitHub-Api-Version': '2022-11-28',
              } },
            );
            if (!response.ok) {
              throw new Error('GitHub API ' + route + ' failed: HTTP ' + response.status);
            }
            return response.json();
          };
          const associatedPulls = await github(
            '/commits/' + process.env.EVENT_SHA + '/pulls',
          );
          const releaseCandidate = associatedPulls.find((pull) =>
            pull.merged_at
            && pull.merge_commit_sha === process.env.EVENT_SHA
            && pull.base?.ref === 'master'
            && pull.head?.repo?.full_name === process.env.GITHUB_REPOSITORY
            && (
              (
                pull.user?.login === process.env.REPOSITORY_OWNER
                && pull.head?.ref === 'release/v' + version
              )
              || (
                pull.user?.login === process.env.RELEASE_BOT_LOGIN
                && pull.head?.ref === 'release/next'
              )
            )
            && pull.title === 'chore(release): prepare v' + version
          );
          if (!releaseCandidate) {
            throw new Error('tag commit is not an authorized merged Release PR');
          }
          const releasePull = await github('/pulls/' + releaseCandidate.number);
          if (
            !releasePull.merged
            || releasePull.merged_by?.login !== process.env.REPOSITORY_OWNER
          ) {
            throw new Error('Release PR was not merged by the repository owner');
          }
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `pull_request=${releasePull.number}\nversion=${version}\n`,
          );
          const releaseFiles = [];
          for (let page = 1; page <= 100; page += 1) {
            const items = await github(
              '/pulls/' + releasePull.number + '/files?per_page=100&page=' + page,
            );
            releaseFiles.push(...items);
            if (items.length < 100) break;
          }
          if (releaseFiles.length !== releasePull.changed_files) {
            throw new Error('Release PR file enumeration is incomplete');
          }
          const requiredReleaseFiles = ['CHANGELOG.md', 'package.json', 'src/version.ts'];
          const allowedReleaseFiles = new Set([...requiredReleaseFiles, 'SECURITY.md']);
          for (const file of requiredReleaseFiles) {
            if (!releaseFiles.some((item) => item.filename === file)) {
              throw new Error('Release PR did not change ' + file);
            }
          }
          for (const file of releaseFiles) {
            if (file.status === 'renamed' || !allowedReleaseFiles.has(file.filename)) {
              throw new Error('Release PR changed a forbidden file');
            }
          }

          const readFile = async (file, ref) => {
            const result = await github(
              '/contents/' + file + '?ref=' + encodeURIComponent(ref),
            );
            if (result.type !== 'file' || typeof result.content !== 'string') {
              throw new Error('cannot read ' + file + ' at ' + ref);
            }
            return Buffer.from(result.content.replace(/\s/gu, ''), 'base64')
              .toString('utf8');
          };
          const [basePackageSource, baseRuntimeSource] = await Promise.all([
            readFile('package.json', releasePull.base.sha),
            readFile('src/version.ts', releasePull.base.sha),
          ]);
          const releasePackage = { ...packageJson };
          const basePackage = JSON.parse(basePackageSource);
          const previousPackage = { ...basePackage };
          delete releasePackage.version;
          delete previousPackage.version;
          if (JSON.stringify(releasePackage) !== JSON.stringify(previousPackage)) {
            throw new Error('Release PR changed package.json beyond its version');
          }
          const baseRuntimeVersion = /^export const KINTIO_VERSION = ['"]([^'"]+)['"];\r?\n?$/u
            .exec(baseRuntimeSource)?.[1];
          if (
            baseRuntimeVersion !== basePackage.version
            || runtimeVersion !== `export const KINTIO_VERSION = '${version}';\n`
          ) {
            throw new Error('Release PR changed the runtime version file unexpectedly');
          }

          const releases = [];
          for (let page = 1; page <= 100; page += 1) {
            const pageItems = await github('/releases?per_page=100&page=' + page);
            if (!Array.isArray(pageItems)) throw new Error('invalid GitHub releases response');
            releases.push(...pageItems);
            if (pageItems.length < 100) break;
          }
          const currentRelease = releases.find((release) => release.tag_name === tag);
          if (currentRelease) {
            throw new Error(`pre-existing release for ${tag} is refused`);
          }

          const parseVersion = (value) => {
            const match = /^v?(\d+)\.(\d+)\.(\d+)$/u.exec(value);
            return match ? match.slice(1).map(Number) : undefined;
          };
          const compare = (left, right) => {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) return left[index] - right[index];
            }
            return 0;
          };
          const immutableTags = fs.readFileSync(
            `${process.env.RUNNER_TEMP}/version-tags.txt`,
            'utf8',
          ).split(/\r?\n/u)
            .filter((versionTag) => /^v\d+\.\d+\.\d+$/u.test(versionTag))
            .filter((versionTag) => versionTag !== tag);
          immutableTags.sort((left, right) =>
            compare(parseVersion(right), parseVersion(left))
          );
          const latestTag = immutableTags[0]?.replace(/^v/u, '');
          if (latestTag && compare(parseVersion(version), parseVersion(latestTag)) <= 0) {
            throw new Error(`${version} must be newer than immutable tag ${latestTag}`);
          }
          const stable = releases
            .filter((release) => !release.draft && !release.prerelease)
            .map((release) => String(release.tag_name || ''))
            .filter((releaseTag) => /^v\d+\.\d+\.\d+$/u.test(releaseTag));
          stable.sort((left, right) => compare(parseVersion(right), parseVersion(left)));
          const latestPublished = stable[0]?.replace(/^v/u, '');
          if (latestPublished && compare(parseVersion(version), parseVersion(latestPublished)) < 0) {
            throw new Error(`${version} must be newer than published ${latestPublished}`);
          }

          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/u);
          const unreleased = lines.reduce(
            (indexes, line, index) => line === '## Unreleased' ? [...indexes, index] : indexes,
            [],
          );
          if (unreleased.length !== 1) throw new Error('CHANGELOG.md requires one Unreleased section');
          const findVersion = (target) => {
            const escaped = target.replaceAll('.', '\\.');
            const matches = lines.reduce(
              (indexes, line, index) =>
                (
                  line === `## ${target}`
                  || new RegExp(
                    `^## ${escaped} - \\d{4}-\\d{2}-\\d{2}$`,
                    'u',
                  ).test(line)
                )
                  ? [...indexes, index]
                  : indexes,
              [],
            );
            if (matches.length !== 1) {
              throw new Error(`CHANGELOG.md requires one section for ${target}`);
            }
            return matches[0];
          };
          const start = findVersion(version);
          if (unreleased[0] > start) throw new Error('Unreleased must precede released versions');
          const nextSection = lines.findIndex(
            (line, index) => index > start && line.startsWith('## '),
          );
          const end = latestPublished && latestPublished !== version
            ? findVersion(latestPublished)
            : (nextSection < 0 ? lines.length : nextSection);
          if (end <= start) throw new Error('published changelog versions are not descending');
          const notes = lines.slice(start + 1, end).join('\n').trim();
          if (!notes.split('\n').some((line) => line.startsWith('- '))) {
            throw new Error(`CHANGELOG.md has no unpublished entries for ${version}`);
          }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/release-notes.md`, `${notes}\n`);
          NODE

          tag_ref="refs/tags/$RELEASE_TAG"
          tag_type=$(git cat-file -t "$tag_ref" 2>/dev/null || true)
          test "$tag_type" = 'tag' || {
            echo 'Release tags must be annotated tags.'
            exit 1
          }
          tag_target_type=$(git cat-file -p "$tag_ref" | sed -n 's/^type //p')
          test "$tag_target_type" = 'commit' || {
            echo 'The annotated release tag must point directly to a commit.'
            exit 1
          }
          commit=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse "$tag_ref^{commit}")
          event_commit=$(git rev-parse "${EVENT_SHA}^{commit}")
          test "$commit" = "$event_commit" && test "$commit" = "$tag_commit" || {
            echo 'Checked out commit differs from the annotated tag; release refused.'
            exit 1
          }
          git merge-base --is-ancestor "$commit" refs/remotes/origin/master || {
            echo 'Tagged commit is not reachable from origin/master; release refused.'
            exit 1
          }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - run: pnpm exec tsc -p tsconfig.test.json
      - run: KNIP_DISABLE_RAW_TRANSFER=1 pnpm exec knip
      - run: pnpm test
      - run: pnpm run build
      - name: Pack the verified npm artifact
        id: package
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          node --experimental-strip-types scripts/prepare-package.ts
          npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-package" > "$RUNNER_TEMP/npm-pack.json"
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';

          const results = JSON.parse(fs.readFileSync(
            process.env.RUNNER_TEMP + '/npm-pack.json',
            'utf8',
          ));
          if (!Array.isArray(results) || results.length !== 1) {
            throw new Error('npm pack must produce exactly one package');
          }
          const [packed] = results;
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (packed.name !== packageJson.name || packed.version !== packageJson.version) {
            throw new Error('packed identity differs from package.json');
          }
          if (
            packageJson.private === true
            || packageJson.publishConfig?.access !== 'public'
            || packageJson.publishConfig?.registry !== 'https://registry.npmjs.org/'
          ) {
            throw new Error('package is not configured for the public npm Registry');
          }
          if (
            typeof packed.filename !== 'string'
            || packed.filename !== path.basename(packed.filename)
          ) {
            throw new Error('npm pack returned an unsafe filename');
          }
          const tarball = path.join(
            process.env.RUNNER_TEMP,
            'npm-package',
            packed.filename,
          );
          const integrity = 'sha512-' + createHash('sha512')
            .update(fs.readFileSync(tarball))
            .digest('base64');
          if (packed.integrity !== integrity) {
            throw new Error('npm pack integrity differs from the tarball bytes');
          }
          const metadata = {
            name: packed.name,
            version: packed.version,
            filename: packed.filename,
            integrity,
          };
          fs.writeFileSync(
            process.env.RUNNER_TEMP + '/npm-package/package-metadata.json',
            JSON.stringify(metadata, null, 2) + '\n',
          );
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            Object.entries(metadata)
              .map(([key, value]) => key + '=' + value + '\n')
              .join(''),
          );
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes-${{ github.run_id }}
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package-${{ github.run_id }}
          path: ${{ runner.temp }}/npm-package
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  publish-npm:
    needs: verify
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ github.run_id }}
          path: release-input
      - name: Publish with OIDC or verify an identical existing version
        env:
          EXPECTED_NAME: ${{ needs.verify.outputs.package_name }}
          EXPECTED_VERSION: ${{ needs.verify.outputs.package_version }}
          EXPECTED_FILE: ${{ needs.verify.outputs.package_file }}
          EXPECTED_INTEGRITY: ${{ needs.verify.outputs.package_integrity }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';

          const registry = 'https://registry.npmjs.org/';
          const metadata = JSON.parse(fs.readFileSync(
            'release-input/package-metadata.json',
            'utf8',
          ));
          const expected = {
            name: process.env.EXPECTED_NAME,
            version: process.env.EXPECTED_VERSION,
            filename: process.env.EXPECTED_FILE,
            integrity: process.env.EXPECTED_INTEGRITY,
          };
          for (const key of Object.keys(expected)) {
            if (metadata[key] !== expected[key]) {
              throw new Error('downloaded package ' + key + ' differs from verification');
            }
          }
          if (metadata.filename !== path.basename(metadata.filename)) {
            throw new Error('downloaded package filename is unsafe');
          }
          const tarball = path.resolve('release-input', metadata.filename);
          const integrity = 'sha512-' + createHash('sha512')
            .update(fs.readFileSync(tarball))
            .digest('base64');
          if (integrity !== metadata.integrity) {
            throw new Error('downloaded tarball integrity differs from verification');
          }

          const npmVersion = spawnSync('npm', ['--version'], { encoding: 'utf8' });
          if (npmVersion.status !== 0) throw new Error('cannot read npm version');
          const found = npmVersion.stdout.trim().split('.').map(Number);
          const minimum = [11, 5, 1];
          let comparison = 0;
          for (let index = 0; index < minimum.length && comparison === 0; index += 1) {
            comparison = Math.sign((found[index] || 0) - minimum[index]);
          }
          if (comparison < 0) {
            throw new Error('npm 11.5.1 or newer is required');
          }

          const spec = metadata.name + '@' + metadata.version;
          const viewIntegrity = () => {
            const result = spawnSync(
              'npm',
              ['view', spec, 'dist.integrity', '--json', '--registry', registry],
              { encoding: 'utf8' },
            );
            if (result.status === 0) {
              const value = JSON.parse(result.stdout || 'null');
              if (typeof value !== 'string') {
                throw new Error('invalid Registry metadata for ' + spec);
              }
              return value;
            }
            const output = (result.stdout || '') + '\n' + (result.stderr || '');
            if (/\bE404\b|404 Not Found/u.test(output)) return undefined;
            throw new Error('cannot query ' + spec + ': ' + output.trim());
          };
          const distTagsContainVersion = () => {
            const result = spawnSync(
              'npm',
              ['dist-tag', 'ls', metadata.name, '--registry', registry],
              { encoding: 'utf8' },
            );
            if (result.status !== 0) {
              throw new Error('cannot query npm dist-tags for ' + metadata.name);
            }
            return result.stdout.split(/\r?\n/u).some((line) => {
              const separator = line.indexOf(':');
              return separator >= 0
                && line.slice(separator + 1).trim() === metadata.version;
            });
          };

          const existing = viewIntegrity();
          if (existing !== undefined && existing !== metadata.integrity) {
            throw new Error(spec + ' already exists with different bytes');
          }
          if (existing === metadata.integrity) {
            console.log(spec + ' already exists with the verified integrity');
            process.exit(0);
          }

          const pendingFromEarlierRun = distTagsContainVersion();
          if (!pendingFromEarlierRun) {
            const published = spawnSync(
              'npm',
              ['publish', tarball, '--ignore-scripts', '--access', 'public', '--registry', registry],
              { stdio: 'inherit' },
            );
            if (published.status !== 0 && !distTagsContainVersion()) {
              throw new Error('npm publish failed without reserving the release dist-tag');
            }
          } else {
            console.log(spec + ' is already pending npm publish-time scanning');
          }

          let lastError;
          for (let attempt = 1; attempt <= 80; attempt += 1) {
            let current;
            try {
              current = viewIntegrity();
              lastError = undefined;
            } catch (error) {
              lastError = error;
            }
            if (current === metadata.integrity) {
              console.log(spec + ' is installable with the verified integrity');
              process.exit(0);
            }
            if (current !== undefined) {
              throw new Error(spec + ' appeared with different bytes');
            }
            if (attempt === 1 || attempt % 4 === 0) {
              console.log('npm publish-time scan pending; attempt=' + attempt);
              if (lastError) console.log(String(lastError.message || lastError));
            }
            await new Promise((resolve) => setTimeout(resolve, 15_000));
          }
          throw lastError || new Error(spec + ' did not become installable within 20 minutes');
          NODE

  smoke-registry:
    needs: [verify, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install the public Registry package
        env:
          PACKAGE_NAME: ${{ needs.verify.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.verify.outputs.package_version }}
        run: |
          npm install --global --prefix "$RUNNER_TEMP/kintio-global" "$PACKAGE_NAME@$PACKAGE_VERSION" --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org/
          test "$("$RUNNER_TEMP/kintio-global/bin/kintio" --version)" = "$PACKAGE_VERSION"
          HOME="$RUNNER_TEMP/kintio-profile" "$RUNNER_TEMP/kintio-global/bin/kintio" setup
          test -f "$RUNNER_TEMP/kintio-profile/.kintio/.env"
          test -f "$RUNNER_TEMP/kintio-profile/.kintio/codex-workspace/.agents/skills/wechat-kf-reply-sop/SKILL.md"
      - name: Verify Registry signatures and Trusted Publishing provenance
        env:
          PACKAGE_NAME: ${{ needs.verify.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.verify.outputs.package_version }}
          EXPECTED_REPOSITORY: https://github.com/${{ github.repository }}
          EXPECTED_WORKFLOW: .github/workflows/release.yml
          EXPECTED_REF: refs/tags/${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          mkdir "$RUNNER_TEMP/provenance-audit"
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync(process.argv[1], '{\"private\":true}\n')" "$RUNNER_TEMP/provenance-audit/package.json"
          npm install --prefix "$RUNNER_TEMP/provenance-audit" --save-exact "$PACKAGE_NAME@$PACKAGE_VERSION" --ignore-scripts --no-audit --no-fund --registry https://registry.npmjs.org/
          set +e
          npm audit signatures --prefix "$RUNNER_TEMP/provenance-audit" --json --include-attestations > "$RUNNER_TEMP/provenance-audit/report.json"
          set -e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const report = JSON.parse(fs.readFileSync(
            process.env.RUNNER_TEMP + '/provenance-audit/report.json',
            'utf8',
          ));
          const targetFailure = [
            ...(report.invalid || []),
            ...(report.missing || []),
          ].find((item) =>
            item.name === process.env.PACKAGE_NAME
            && item.version === process.env.PACKAGE_VERSION
          );
          if (targetFailure) {
            throw new Error('npm reported invalid or missing Kintio signatures');
          }
          const target = report.verified?.find((item) =>
            item.name === process.env.PACKAGE_NAME
            && item.version === process.env.PACKAGE_VERSION
          );
          if (!target?.attestations?.provenance) {
            throw new Error('Trusted Publishing provenance is missing');
          }
          const provenance = target.attestationBundles?.find(
            (item) => item.predicateType === 'https://slsa.dev/provenance/v1',
          );
          if (!provenance?.bundle?.dsseEnvelope?.payload) {
            throw new Error('verified SLSA provenance bundle is missing');
          }
          const statement = JSON.parse(Buffer.from(
            provenance.bundle.dsseEnvelope.payload,
            'base64',
          ).toString('utf8'));
          const build = statement.predicate?.buildDefinition;
          const workflow = build?.externalParameters?.workflow;
          const sourceCommit = build?.resolvedDependencies?.some(
            (item) => item.digest?.gitCommit === process.env.EXPECTED_COMMIT,
          );
          if (
            workflow?.repository !== process.env.EXPECTED_REPOSITORY
            || workflow?.path !== process.env.EXPECTED_WORKFLOW
            || workflow?.ref !== process.env.EXPECTED_REF
            || !sourceCommit
            || statement.predicate?.runDetails?.builder?.id
              !== 'https://github.com/actions/runner/github-hosted'
          ) {
            throw new Error('provenance does not match the release workflow and commit');
          }
          NODE

  release:
    needs: [verify, publish-npm, smoke-registry]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes-${{ github.run_id }}
          path: release-input
      - name: Verify remote tag and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type')
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$tag_type" = 'tag' || {
            echo 'Release tags must be annotated tags.'
            exit 1
          }
          target_type=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.object.type')
          target_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.object.sha')
          test "$target_type" = 'commit' && test "$target_commit" = "$VERIFIED_COMMIT" || {
            echo 'Remote tag no longer points to the verified commit; release refused.'
            exit 1
          }

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file release-input/release-notes.md

  prepare-next:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Reconcile the next Release PR after publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run prepare-release.yml
          --repo "$GITHUB_REPOSITORY"
          --ref master

  report:
    if: always() && needs.verify.outputs.pull_request != ''
    needs: [verify, publish-npm, smoke-registry, release, prepare-next]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Update the Release PR with the terminal result
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_NUMBER: ${{ needs.verify.outputs.pull_request }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_STATUS: >-
            ${{ needs.verify.result == 'success' &&
                needs.publish-npm.result == 'success' &&
                needs.smoke-registry.result == 'success' &&
                needs.release.result == 'success' &&
                needs.prepare-next.result == 'success' &&
                'succeeded' || 'failed' }}
          RELEASE_VERSION: ${{ needs.verify.outputs.release_version }}
        run: >-
          node --experimental-strip-types
          .github/scripts/report-release.ts
