[package]
name = "kintio-native"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
description = "Native Kintio runtime under compatibility migration"
license = "Apache-2.0"
repository = "https://github.com/Gkxie/kintio"
publish = false
build = "rust/build.rs"

[lib]
path = "rust/lib.rs"

[[bin]]
name = "kintio-rs"
path = "rust/main.rs"

[[test]]
name = "native-cli"
path = "rust-tests/cli.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
getrandom = "0.4.3"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["process"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
